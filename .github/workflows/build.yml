name: Build Diretta Scanner APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable debug keystore
        run: base64 -d stable-debug-keystore.b64 > stable-debug.keystore

      - name: Fix compact sameTeam syntax
        run: |
          sed -i '128c\    private fun sameTeam(a:String,b:String):Boolean { val regex=Regex("[^\\p{L}\\p{N}]+"); val x=a.lowercase().replace(regex," ").trim(); val y=b.lowercase().replace(regex," ").trim(); return x==y || x.startsWith(y) || y.startsWith(x) }' app/src/main/java/com/joker/direttascannerbuild/MainActivity.kt

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DirettaScanner-v0.14.0-PROFILO70
          path: app/build/outputs/apk/debug/app-debug.apk
