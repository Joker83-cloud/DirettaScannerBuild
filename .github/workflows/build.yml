name: Build Diretta Scanner APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore stable debug keystore
        run: base64 -d stable-debug-keystore.b64 > stable-debug.keystore
      - name: Apply v0.14.5 SAFE-SNAI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/joker/direttascannerbuild/MainActivity.kt'); s=p.read_text()
          s=s.replace('    private fun sameTeam(a:String,b:String):Boolean{fun n(s:String)=s.lowercase().replace(Regex("[^\\\\p{L}\\\\p{N}]+")," ").trim();val x=n(a);val y=n(b);return x==y||x.startsWith(y)||y.startsWith(x)}','    private fun sameTeam(a:String,b:String):Boolean { val x=a.lowercase().filter { it.isLetterOrDigit() }; val y=b.lowercase().filter { it.isLetterOrDigit() }; return x==y || x.startsWith(y) || y.startsWith(x) }')
          s=s.replace('v0.14.0','v0.14.5 SAFE-SNAI').replace('DirettaScanner/0.14.0','DirettaScanner/0.14.5-safe-snai')

          oe='''function expand(){let n=0;for(const h of [...document.querySelectorAll('.event__header,[class*=\\"event__header\\"]')]){const low=(String(h.className||'')+' '+txt(h)).toLowerCase();if(/menu|drawer|navigation|sidebar|filter|setting|preferit/.test(low))continue;const c=h.querySelector('[aria-expanded=\\"false\\"],button[data-testid*=\\"expand\\"],[role=\\"button\\"][data-testid*=\\"expand\\"]');if(c&&c.getAttribute('aria-expanded')==='false'){try{c.click();n++;}catch(e){}}}return n;}'''
          ne='''function expand(){let n=0;for(const h of [...document.querySelectorAll('.event__header,[class*=\\"event__header\\"]')]){const low=(String(h.className||'')+' '+txt(h)).toLowerCase();if(/menu|drawer|navigation|sidebar|filter|setting|preferit/.test(low))continue;let c=h.querySelector('[aria-expanded=\\"false\\"]');if(!c)c=h.querySelector('[class*=\\"leagueShowMoreCont\\"],[class*=\\"event__expander\\"],[class*=\\"event__collapse\\"],[class*=\\"event__toggle\\"],button[data-testid*=\\"expand\\"],[role=\\"button\\"][data-testid*=\\"expand\\"]');if(!c){const cand=[...h.querySelectorAll('button,[role=\\"button\\"],div,span')].filter(e=>{const cl=String(e.className||'').toLowerCase();const ar=e.getAttribute&&e.getAttribute('aria-expanded');return ar==='false'||/showmore|expander|collapse|toggle/.test(cl);});c=cand.length?cand[cand.length-1]:null;}if(c){const ar=c.getAttribute&&c.getAttribute('aria-expanded');const st=c.getAttribute&&c.getAttribute('data-state');const cl=String(c.className||'').toLowerCase();if(ar==='false'||st==='closed'||/showmore|collapsed|closed/.test(cl)){try{c.click();n++;}catch(e){}}}}return n;}'''
          if oe not in s: raise SystemExit('expand missing')
          s=s.replace(oe,ne)

          od='        detailWeb.webViewClient=object:WebViewClient(){override fun onPageFinished(view:WebView?,url:String?){super.onPageFinished(view,url);val key=currentDetailKey?:return;val gen=detailGeneration;handler.postDelayed({if(currentDetailKey==key&&detailGeneration==gen)openOddsTab()},800);handler.postDelayed({if(currentDetailKey==key&&detailGeneration==gen)extractDetailSnai(false)},2600);handler.postDelayed({if(currentDetailKey==key&&detailGeneration==gen)extractDetailSnai(false)},5000);handler.postDelayed({if(currentDetailKey==key&&detailGeneration==gen)extractDetailSnai(true)},8000)}}'
          nd='        detailWeb.webViewClient=object:WebViewClient(){override fun onPageFinished(view:WebView?,url:String?){super.onPageFinished(view,url);val key=currentDetailKey?:return;val gen=detailGeneration;val u=url?:"";if(u.contains("/quote/quote-1x2/")){handler.postDelayed({if(currentDetailKey==key&&detailGeneration==gen)extractDetailSnai(false)},1200);handler.postDelayed({if(currentDetailKey==key&&detailGeneration==gen)extractDetailSnai(false)},3200);handler.postDelayed({if(currentDetailKey==key&&detailGeneration==gen)extractDetailSnai(false)},6000)}else{handler.postDelayed({if(currentDetailKey==key&&detailGeneration==gen)openOddsTab()},800);handler.postDelayed({if(currentDetailKey==key&&detailGeneration==gen)extractDetailSnai(false)},4500)}}}'
          if od not in s: raise SystemExit('detail client missing')
          s=s.replace(od,nd)

          oh='        historyWeb.webViewClient=object:WebViewClient(){override fun onPageFinished(view:WebView?,url:String?){super.onPageFinished(view,url);val key=currentHistoryKey?:return;val gen=historyGeneration;handler.postDelayed({if(currentHistoryKey==key&&historyGeneration==gen)extractHistory(false)},1800);handler.postDelayed({if(currentHistoryKey==key&&historyGeneration==gen)extractHistory(false)},3500);handler.postDelayed({if(currentHistoryKey==key&&historyGeneration==gen)extractHistory(true)},6000)}}'
          nh='        historyWeb.webViewClient=object:WebViewClient(){override fun onPageFinished(view:WebView?,url:String?){super.onPageFinished(view,url);val key=currentHistoryKey?:return;val gen=historyGeneration;handler.postDelayed({if(currentHistoryKey==key&&historyGeneration==gen)extractHistory(false)},1200);handler.postDelayed({if(currentHistoryKey==key&&historyGeneration==gen)extractHistory(false)},2800);handler.postDelayed({if(currentHistoryKey==key&&historyGeneration==gen)extractHistory(true)},5000)}}'
          if oh not in s: raise SystemExit('history client missing')
          s=s.replace(oh,nh)

          op='    private fun processNextDetail(){if(currentDetailKey!=null)return;val key=if(detailQueue.isEmpty())null else detailQueue.removeFirst();if(key==null){updateStatus();processNextHistory();return};val m=matches[key]?:run{processNextDetail();return};currentDetailKey=key;detailGeneration++;val gen=detailGeneration;status.text="SNAI… ${detailsAttempted+1} · ${m.time} ${m.home} vs ${m.away}";detailWeb.loadUrl(m.url);handler.postDelayed({if(currentDetailKey==key&&detailGeneration==gen)openOddsTab()},1800);handler.postDelayed({if(currentDetailKey==key&&detailGeneration==gen)extractDetailSnai(false)},4200);handler.postDelayed({if(currentDetailKey==key&&detailGeneration==gen)extractDetailSnai(true)},9500)}'
          np='    private fun processNextDetail(){if(currentDetailKey!=null)return;val key=if(detailQueue.isEmpty())null else detailQueue.removeFirst();if(key==null){updateStatus();processNextHistory();return};val m=matches[key]?:run{processNextDetail();return};currentDetailKey=key;detailGeneration++;val gen=detailGeneration;val total=detailsAttempted+detailQueue.size+1;status.text="SNAI ${detailsAttempted+1}/$total · ${m.time} ${m.home} vs ${m.away}";val base=m.url.substringBefore("?").trimEnd('/');val query=m.url.substringAfter("?","");val qurl=if(base.contains("/quote/"))m.url else base+"/quote/quote-1x2/finale/"+(if(query.isNotBlank())"?"+query else "");detailWeb.loadUrl(qurl);handler.postDelayed({if(currentDetailKey==key&&detailGeneration==gen)extractDetailSnai(false)},8500);handler.postDelayed({if(currentDetailKey==key&&detailGeneration==gen)extractDetailSnai(true)},15000)}'
          if op not in s: raise SystemExit('process detail missing')
          s=s.replace(op,np)

          oph='    private fun processNextHistory(){if(currentHistoryKey!=null)return;val key=if(historyQueue.isEmpty())null else historyQueue.removeFirst();if(key==null){updateStatus();return};val m=matches[key]?:run{processNextHistory();return};currentHistoryKey=key;historyPhase="HOME";historyGeneration++;m.historyState="RUNNING";status.text="PROFILO 70%… ${m.home} vs ${m.away} · storico casa";historyWeb.loadUrl(resultsUrl(m.homeUrl))}'
          nph='    private fun processNextHistory(){if(currentHistoryKey!=null)return;val key=if(historyQueue.isEmpty())null else historyQueue.removeFirst();if(key==null){updateStatus();return};val m=matches[key]?:run{processNextHistory();return};currentHistoryKey=key;historyPhase="HOME";historyGeneration++;val gen=historyGeneration;m.historyState="RUNNING";val total=historyCompleted+historyUnavailable+historyQueue.size+1;status.text="STORICO ${historyCompleted+historyUnavailable+1}/$total · ${m.home} vs ${m.away}";historyWeb.loadUrl(resultsUrl(m.homeUrl));handler.postDelayed({if(currentHistoryKey==key&&historyGeneration==gen)extractHistory(true)},8000)}'
          if oph not in s: raise SystemExit('process history missing')
          s=s.replace(oph,nph)
          s=s.replace('handler.postDelayed({processNextDetail()},250)','handler.postDelayed({processNextDetail()},120)').replace('handler.postDelayed({processNextHistory()},200)','handler.postDelayed({processNextHistory()},120)').replace('handler.postDelayed({processNextHistory()},300)','handler.postDelayed({processNextHistory()},120)')
          p.write_text(s)
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DirettaScanner-v0.14.5-SAFE-SNAI-PROFILO70
          path: app/build/outputs/apk/debug/app-debug.apk
