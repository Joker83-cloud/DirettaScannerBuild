name: Build Diretta Scanner APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore stable debug keystore
        run: base64 -d stable-debug-keystore.b64 > stable-debug.keystore

      - name: Fix compact sameTeam syntax
        run: |
          sed -i "128c\\    private fun sameTeam(a:String,b:String):Boolean { val x=a.lowercase().filter { it.isLetterOrDigit() }; val y=b.lowercase().filter { it.isLetterOrDigit() }; return x==y || x.startsWith(y) || y.startsWith(x) }" app/src/main/java/com/joker/direttascannerbuild/MainActivity.kt

      - name: Apply FAST scan tuning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/joker/direttascannerbuild/MainActivity.kt')
          s = p.read_text()
          s = s.replace('v0.14.0', 'v0.14.1 FAST').replace('0.14.0"', '0.14.1-fast"')
          s = s.replace('},800);handler.postDelayed', '},350);handler.postDelayed')
          s = s.replace('},2600);handler.postDelayed', '},1100);handler.postDelayed')
          s = s.replace('},5000);handler.postDelayed', '},2100);handler.postDelayed')
          s = s.replace('},8000)}}', '},3800)}}')
          s = s.replace('},1800);handler.postDelayed', '},700);handler.postDelayed')
          s = s.replace('},3500);handler.postDelayed', '},1600);handler.postDelayed')
          s = s.replace('},6000)}}', '},3000)}}')
          s = s.replace('},4200);handler.postDelayed', '},1700);handler.postDelayed')
          s = s.replace('},9500)}', '},4000)}')
          s = s.replace('handler.postDelayed({processNextDetail()},250)', 'handler.postDelayed({processNextDetail()},80)')
          s = s.replace('handler.postDelayed({processNextHistory()},200)', 'handler.postDelayed({processNextHistory()},100)')
          s = s.replace('handler.postDelayed({processNextHistory()},300)', 'handler.postDelayed({processNextHistory()},100)')
          p.write_text(s)
          PY

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DirettaScanner-v0.14.1-FAST-PROFILO70
          path: app/build/outputs/apk/debug/app-debug.apk
